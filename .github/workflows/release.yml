name: Create Release

# Publishes a GitHub release when index.json's newest version has no tag yet.
#
# Runs AFTER CI (ci.yml) finishes on main, never alongside it. Triggered by
# the same push instead, it raced ci.yml's `build` job: it could read the
# newest index.json entry while still null (build stamps it), and it never
# waited for the strict tests, so a version failing the integrity checks
# could still be tagged and published with plugin_manager.py attached.
#
# Gated on, all from the workflow_run payload:
#   - upstream only: on forks ci.yml runs fork-check instead of build, and a
#     fork's main isn't authoritative for releases;
#   - CI succeeded on a push to main;
#   - the pushed commit isn't plugman-ci's own: build skips those, so there
#     is nothing to release from them (the run that made them already did).
#
# What gets released is the commit build uploaded as `tested-commit`: the
# tree after build's own [ci] pushes and its strict tests, not the commit
# that was pushed.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

# Two releases in flight would read the same "previous tag" and both try to
# create the next one; serialised, the second sees the first's tag and
# no-ops via versioning_tools.py. Never cancel-in-progress: a cancelled run
# can leave a tag created with no release attached to it.
concurrency:
  group: create-release
  cancel-in-progress: false

jobs:
  build:
    name: Create Release
    if: >-
      github.repository == 'bombsquad-community/plugin-manager' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_commit.committer.name != 'plugman-ci'
    runs-on: ubuntu-latest
    permissions:
      contents: write # tag and release
      actions: read # download the tested-commit artifact from the CI run
    steps:
      - name: Download the tested commit from the CI run
        uses: actions/download-artifact@v8
        with:
          name: tested-commit
          path: tested
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Read the tested commit
        id: tested
        run: |
          set -euo pipefail
          SHA="$(cat tested/sha.txt)"
          # Only ever a full sha written by ci.yml; refuse anything else
          # rather than hand it to checkout.
          if ! [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "tested-commit artifact holds no valid sha: '$SHA'" >&2
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.tested.outputs.sha }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: 'Get Previous tag'
        uses: oprypin/find-latest-tag@v1.1.3
        with:
          repository: ${{ github.repository }}
          releases-only: true # We know that all relevant tags have a GitHub release for them.
        id: previoustag

      - name: set_variables
        env:
          PREVIOUS_TAG: ${{ steps.previoustag.outputs.tag }}
        run: |
          output1=$(python3 test/get_latest.py get_latest_plugman_version)
          {
            echo "changelog<<EOF"
            python3 test/get_changelog.py "$output1"
            echo EOF
          } >> "$GITHUB_OUTPUT"
          output2=$(python3 test/get_latest.py get_latest_api)
          output3=$(python3 test/versioning_tools.py "$PREVIOUS_TAG")
          echo "latestVersion=$output1" >> $GITHUB_OUTPUT
          echo "latestAPI=$output2" >> $GITHUB_OUTPUT
          echo "shouldRun=$output3" >> $GITHUB_OUTPUT
        id: set_variables

      - name: Bump version and push tag
        if: ${{ steps.set_variables.outputs.shouldRun == '1' }}
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          custom_tag: |
            ${{ steps.set_variables.outputs.latestVersion }}

      - name: Create release
        if: ${{ steps.tag_version.outputs.new_tag }}
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.tag_version.outputs.new_tag }}
          name: ${{ steps.tag_version.outputs.new_tag }} (api ${{ steps.set_variables.outputs.latestAPI }})
          artifacts: 'plugin_manager.py'
          body: |
            ## Changelog
            ${{ steps.set_variables.outputs.changelog }}
