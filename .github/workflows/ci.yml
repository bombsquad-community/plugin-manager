name: CI

# Runs only on pushes to main - i.e. after a PR has been merged, or on a
# direct maintainer push. This is fully trusted, same-repo content, so it's
# safe for it to execute the tree and push directly. This is also the
# AUTHORITATIVE integrity check: test/test_checks.py's test_versions runs
# here unmodified/strict against real, permanent git history (unlike
# ci-check.yml, which can't yet resolve a commit sha for a brand-new plugin
# version and runs leniently instead).
#
# It must run the SAME metadata pipeline as the PR path (ci-check.yml ->
# ci-apply.yml): autopep8, then auto_apply_plugin_metadata.py, then
# auto_apply_version_metadata.py. Content can reach main without ever going
# through the PR workflows - a direct maintainer push, or a merge of a PR
# whose checks failed - so a gap here is not covered anywhere else.
#
# Concretely, without the plugin-metadata step a push that bumps a plugin's
# `plugman` version lands the new bytes with no matching manifest entry. The
# manifest goes on advertising the OLD version's md5sum, so the in-game
# manager's checksum check rejects every download of that plugin, and
# test_latest_version fails on this and every later run. That is what 8628c97
# (finder 1.0 -> 4.1) did to main; it stayed broken until PR #485 reverted the
# whole change, which restored the old bytes rather than recording the new
# ones.
#
# The auto-commit steps below push with a GitHub App installation token,
# NOT the default GITHUB_TOKEN. main's "require a pull request before
# merging" ruleset refuses GITHUB_TOKEN pushes outright:
#
#   remote: error: GH006: Protected branch update failed for refs/heads/main.
#   remote: - Changes must be made through a pull request.
#
# That is a protection-rule rejection, not a permissions problem, so no
# `permissions:` value can fix it - the token already had contents: write
# when it was refused. The fix is that the pushing actor sits on that
# ruleset's bypass list. GITHUB_TOKEN cannot be given a ruleset bypass at
# all: bypass actors may be repository roles, teams, installed GitHub Apps
# or Dependabot, and the built-in Actions integration is none of those.
# An installed App is, which is why this pushes as one.
#
# SETUP, all of which must hold or the push fails:
#   - An App owned by this org with Contents: Read and write, installed on
#     THIS repository.
#   - secrets.APP_ID and secrets.APP_PRIVATE_KEY (the whole .pem, BEGIN and
#     END lines included).
#   - The App added to the "main: Require pr before merging" ruleset's
#     bypass list. Installing it is NOT what grants the bypass; that is a
#     separate setting and forgetting it produces the GH006 above.
#
# An App is used here rather than a personal access token because an
# installation token is minted per run and expires in an hour, so there is
# no long-lived credential to rotate. A PAT held this job for years and
# then silently expired, which broke every push to main until someone
# noticed the red X.
#
# CONSEQUENCE, and the reason for the job-level `if:` below: unlike
# GITHUB_TOKEN, an App installation token's pushes DO start new workflow
# runs. Without the guard this workflow re-enters itself on its own
# commits, forever. Skipping those re-runs loses nothing, because the
# strict test run at the end of this job already ran against the final tree
# it produced.
#
# The guard keys on the COMMITTER IDENTITY that the three auto-commit steps
# below set, NOT on the commit message. A message guard is unsafe here:
# ci-apply.yml commits "[ci] apply-plugin-metadata-and-formatting" and
# "[ci] apply-version-metadata" onto the PR BRANCH, so those routinely sit at
# a PR branch's tip (see 7d8b18e, 2b1763a). Rebase merge is enabled on this
# repo, and rebase-merging such a PR makes one of them main's head commit. A
# message guard would then skip this whole job - the authoritative test run
# included - on precisely the push that needs it most, because a rebase
# rewrites the very shas ci-apply.yml stamped into the manifests.

on:
  push:
    branches:
      - main

# Least privilege: the pushes in this job authenticate with the App
# installation token, so GITHUB_TOKEN itself never needs write.
permissions:
  contents: read

jobs:
  build:
    # See CONSEQUENCE in the header. Nothing but the auto-commit steps below
    # commits as `plugman-ci`, so this skips this workflow's own pushes and
    # nothing else. Do not remove without first moving the pushes back to an
    # identity whose commits do not trigger workflows.
    #
    # The repository check keeps forks out of a job they cannot pass: the
    # App is not installed on them, and their main is not authoritative for
    # anything.
    if: >-
      github.repository == 'bombsquad-community/plugin-manager' &&
      github.event.head_commit.committer.name != 'plugman-ci'
    runs-on: ubuntu-latest
    steps:
      # Fail fast and legibly on unset secrets. Without this, a missing one
      # surfaces further down as an opaque authentication failure that reads
      # like a protection problem rather than a config one.
      #
      # Failing the whole job - tests included - is deliberate. With no push
      # credential the metadata steps still run and the suite still passes,
      # because both work on this runner's tree; the result would be a green
      # check over a main whose committed manifests were never stamped. That
      # is the exact trap ci-apply.yml's MERGE GATE comment describes. No
      # signal beats a false one.
      - name: Check App credentials are configured
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          MISSING=""
          [ -n "$APP_ID" ] || MISSING="$MISSING secrets.APP_ID"
          [ -n "$APP_PRIVATE_KEY" ] || MISSING="$MISSING secrets.APP_PRIVATE_KEY"
          if [ -n "$MISSING" ]; then
            echo "Not set:$MISSING" >&2
            echo "This workflow cannot push to main without them: the branch" >&2
            echo "ruleset rejects GITHUB_TOKEN pushes (GH006). See SETUP in the" >&2
            echo "header comment." >&2
            exit 1
          fi

      # Mints an installation token scoped to this repository, valid for an
      # hour and revoked by this action's post step. Nothing long-lived is
      # stored anywhere.
      #
      # This must come BEFORE the checkout, since the checkout is what hands
      # the token to git.
      - name: Mint an App installation token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Hands the installation token to git. persist-credentials defaults
          # to true, and that is precisely what makes the three
          # git-auto-commit-action steps below push as the bypassing App
          # rather than as github-actions[bot]. They need no configuration of
          # their own.
          #
          # Note this only sets the AUTHOR of the push. The COMMITTER name
          # that the job-level `if:` guard keys on is set explicitly by each
          # auto-commit step below, so it is unaffected by the token change.
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -U pycodestyle==2.12.1 autopep8
          python -m pip install -U -r test/pip_reqs.txt

      - name: Apply AutoPEP8
        run: |
          autopep8 --in-place --recursive --max-line-length=100 .

      - name: Commit AutoPEP8 formatting
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "[ci] apply-formatting"
          # Identity the job-level `if:` keys on. See CONSEQUENCE in the header.
          commit_user_name: "plugman-ci"
          commit_user_email: "plugman-ci@users.noreply.github.com"

      # Resolved BEFORE any of the auto-commit steps below rewrite HEAD, so it
      # stays the tip main had when this push arrived. github.event.before is
      # absent/zeroed on a branch's first push and dangling after a force
      # push, hence the fallbacks; HEAD^ is the pushed head's first parent,
      # which for a merge commit is the previous main tip.
      - name: Resolve push base
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          BASE="$BEFORE_SHA"
          if [ -z "$BASE" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            # 4b825dc.. is git's empty tree - diffs as "everything is new" and
            # simply fails to resolve as a manifest ref, which the metadata
            # script handles by falling back to origin/main.
            BASE="$(git rev-parse HEAD^ 2>/dev/null || echo 4b825dc642cb6eb9a060e54bf8d69288fbee4904)"
          fi
          echo "$BASE" > "${RUNNER_TEMP}/base_sha.txt"
          echo "Push base: $BASE"

      # The counterpart of ci-check.yml's plugin-metadata step. Diffed against
      # HEAD (not the push head) so plugin files that only the autopep8 commit
      # above touched are included - their bytes changed, so their checksums
      # must be recomputed too.
      #
      # PLUGMAN_BASE_REF is REQUIRED here, for the same reason ci-check.yml
      # sets it. It makes "already published" mean the manifest as of the push
      # base, rather than the working tree. On the ordinary path - merging a
      # PR - the merge brings the version bump AND the manifest entry that
      # ci-apply.yml already stamped onto the PR branch, so the working tree
      # here ALREADY lists the version being pushed. Comparing against that
      # would make the script raise "Version cant be lower or equal" on every
      # single merge. Compared against the base, the version is correctly seen
      # as new, the entry is found already stamped with a matching md5sum, and
      # the step is a no-op.
      #
      # This step FAILING is a feature: it means a plugin's bytes changed with
      # no version bump, which would leave every existing install unable to
      # verify its download.
      - name: Apply Plugin Metadata (writes null version placeholders)
        run: |
          set -euo pipefail
          BASE="$(cat "${RUNNER_TEMP}/base_sha.txt")"
          # --diff-filter=d drops deletions; the script opens each path it is
          # handed, so a removed plugin would crash it.
          git diff --name-only --diff-filter=d "$BASE" HEAD > "${RUNNER_TEMP}/changed_files.txt"
          cat "${RUNNER_TEMP}/changed_files.txt"
          PLUGMAN_BASE_REF="$BASE" \
            python test/auto_apply_plugin_metadata.py "$(cat "${RUNNER_TEMP}/changed_files.txt")"

      - name: Commit Plugin Metadata
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "[ci] apply-plugin-metadata"
          commit_user_name: "plugman-ci"
          commit_user_email: "plugman-ci@users.noreply.github.com"

      - name: Apply Version Metadata
        run: |
          python test/auto_apply_version_metadata.py $(git log --pretty=format:'%h' -n 1)

      - name: Commit Version Metadata
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "[ci] apply-version-metadata"
          commit_user_name: "plugman-ci"
          commit_user_email: "plugman-ci@users.noreply.github.com"

      # Every push is done by this point. Drop the installation token from
      # .git/config before handing control to the repo's own test suite, so
      # that code cannot reach a credential that bypasses main's ruleset.
      # Partial mitigation only: autopep8 and GitPython are unpinned and
      # already ran above with the credential live.
      - name: Drop push credentials
        run: |
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git config --local --unset-all "http.${GITHUB_SERVER_URL}/.extraheader" || true

      - name: Execute Tests
        run: |
          python -m unittest discover -v
